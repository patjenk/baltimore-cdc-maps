<html lang="en">

<meta charset="utf-8">

<title>Baltimore CDC Areas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: header band, then a two-column work area (map left, organization panel right) that stacks on phones; reference sections run full width below. */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --fg: #18211d;
  --muted: #58645e;
  --line: #d6dbd5;
  --land: #e8ebe6;
  --land-line: #bfc6be;
  --land-on: #dfe4dd;
  --accent: #1d5d87;
  --accent-ink: #ffffff;
  --org-l: 46%;
  --org-line-l: 34%;
  --org-alpha: 0.3;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --step-0: 0.875rem;
  --step-1: 1rem;
  --step-2: 1.25rem;
  --step-3: clamp(1.6rem, 1.2rem + 1.6vw, 2.25rem);
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #19201c; --fg: #e4eae6; --muted: #98a49d; --line: #2c3631;
    --land: #1d2420; --land-line: #3a4540; --land-on: #242d28; --accent: #7db4da; --accent-ink: #0d1a24;
    --org-l: 62%; --org-line-l: 70%; --org-alpha: 0.32; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #19201c; --fg: #e4eae6; --muted: #98a49d; --line: #2c3631;
  --land: #1d2420; --land-line: #3a4540; --land-on: #242d28; --accent: #7db4da; --accent-ink: #0d1a24;
  --org-l: 62%; --org-line-l: 70%; --org-alpha: 0.32; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: var(--step-3); line-height: 1.1; }
h2 { font-size: var(--step-2); }
p { margin: 0; }
.lede { color: var(--muted); max-width: 72ch; font-size: var(--step-1); }
header { display: grid; gap: 8px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 600; }

.work { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .work { grid-template-columns: minmax(0, 1fr); } }

.mapbox { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; min-width: 0; }
.mapbox svg.map { display: block; width: 100%; height: auto; touch-action: none; cursor: grab; }
.mapbox svg.map:active { cursor: grabbing; }
.nb { fill: var(--land); stroke: var(--land-line); stroke-width: 0.6; vector-effect: non-scaling-stroke; }
.nb.on { fill: var(--land-on); }
.nb:hover { stroke: var(--fg); stroke-width: 1.4; }
.org path {
  fill: hsl(var(--h) 65% var(--org-l) / var(--org-alpha));
  stroke: hsl(var(--h) 70% var(--org-line-l)); stroke-width: 1.8;
  vector-effect: non-scaling-stroke; pointer-events: none;
  transition: fill-opacity .15s, stroke-opacity .15s;
}
.org path.approx { stroke-dasharray: 5 4; }
svg.focusing .org path { fill-opacity: 0.25; stroke-opacity: 0.25; }
svg.focusing .org.focus path { fill-opacity: 1; stroke-opacity: 1; fill: hsl(var(--h) 65% var(--org-l) / 0.6); }
.labels text {
  font-family: var(--font-body); font-weight: 600; fill: var(--fg); text-anchor: middle; dominant-baseline: middle;
  paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; pointer-events: none;
}
.zoom { position: absolute; right: 10px; top: 10px; display: grid; gap: 4px; }
.zoom button, .seg button, .btn {
  font: inherit; font-weight: 600; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 10px; cursor: pointer;
}
.zoom button { width: 32px; height: 32px; padding: 0; font-size: 1rem; }
button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 14px; border-top: 1px solid var(--line); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 26px; height: 12px; flex: none; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; max-width: 280px;
  box-shadow: 0 4px 16px rgb(0 0 0 / 0.15); font-size: 0.8125rem; z-index: 2;
}
.tip strong { display: block; font-family: var(--font-display); font-size: 0.9375rem; margin-bottom: 2px; }
.tip ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 2px; }
.tip li, .orgrow label { display: flex; align-items: baseline; gap: 6px; }

.sw { flex: none; width: 11px; height: 11px; border-radius: 2px; background: hsl(var(--h) 65% var(--org-l)); border: 1px solid hsl(var(--h) 70% var(--org-line-l)); transform: translateY(1px); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: grid; min-width: 0; }
.controls { display: grid; gap: 10px; padding: 14px; border-bottom: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
.seg button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); position: relative; }
.label-sm { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
#search { font: inherit; width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--fg); }
.list { list-style: none; margin: 0; padding: 6px 0; max-height: min(72vh, 760px); overflow-y: auto; }
@media (max-width: 900px) { .list { max-height: none; } }
.orgrow { padding: 8px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; border-bottom: 1px solid var(--line); }
.orgrow:last-child { border-bottom: 0; }
.orgrow:hover { background: var(--bg); }
.orgrow.off-filter { opacity: 0.45; }
.orgrow label { cursor: pointer; font-weight: 600; min-width: 0; }
.orgrow input { margin: 0; flex: none; accent-color: var(--accent); transform: translateY(2px); }
.orgrow .meta { grid-column: 1 / -1; color: var(--muted); padding-left: 37px; font-size: 0.8125rem; }
.orgrow details { grid-column: 1 / -1; padding-left: 37px; }
.orgrow summary { cursor: pointer; color: var(--accent); font-size: 0.8125rem; width: max-content; }
.only { font: inherit; font-size: 0.75rem; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 2px 4px; }
.proj { list-style: none; margin: 6px 0 2px; padding: 0; display: grid; gap: 8px; font-size: 0.8125rem; }
.proj .t { font-weight: 600; }
.proj .n { color: var(--muted); }
.badge { display: inline-block; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; color: var(--muted); }
.badge.approximate { border-style: dashed; }
.empty { padding: 16px 14px; color: var(--muted); }

.ref { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 0.8125rem; }
th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.refs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.refs > div { display: grid; gap: 10px; align-content: start; }
.refs ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .org path { transition: none; } }
</style>

</head>

<div class="wrap">
  <p class="back"><a href="./">&larr; Baltimore community development maps</a></p>
  <header>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="work">
    <div class="mapbox" id="mapbox">
      <div class="zoom">
        <button type="button" id="zin" aria-label="Zoom in">+</button>
        <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
        <button type="button" id="zreset" aria-label="Reset map view" title="Reset view">&#8634;</button>
      </div>
      <div class="tip" id="tip" hidden></div>
      <div class="legend">
        <span><svg viewBox="0 0 26 12" aria-hidden="true"><rect x="1" y="1" width="24" height="10" style="fill:hsl(200 65% var(--org-l) / .3);stroke:hsl(200 70% var(--org-line-l));stroke-width:1.8"/></svg><span id="legend-solid"></span></span>
        <span><svg viewBox="0 0 26 12" aria-hidden="true"><rect x="1" y="1" width="24" height="10" style="fill:hsl(200 65% var(--org-l) / .3);stroke:hsl(200 70% var(--org-line-l));stroke-width:1.8;stroke-dasharray:5 4"/></svg><span id="legend-dashed"></span></span>
        <span>Hover or tap a neighborhood to see who works there. Scroll or pinch to zoom.</span>
      </div>
    </div>

    <aside class="panel" aria-label="Organizations">
      <div class="controls">
        <div class="row">
          <span class="label-sm" id="filter-label"></span>
          <div class="seg" role="group" id="filter"></div>
        </div>
        <div class="row">
          <button type="button" class="btn" id="allon">Show all</button>
          <button type="button" class="btn" id="alloff">Hide all</button>
        </div>
        <input id="search" type="search" placeholder="Find an organization or neighborhood" aria-label="Find an organization or neighborhood">
      </div>
      <ul class="list" id="list"></ul>
    </aside>
  </div>

  <section class="ref" id="unmapped-section">
    <h2 id="unmapped-title"></h2>
    <p class="lede" id="unmapped-lede"></p>
    <div class="tablewrap"><table>
      <thead><tr id="unmapped-head"></tr></thead>
      <tbody id="unmapped"></tbody>
    </table></div>
  </section>

  <section class="ref refs">
    <div>
      <h2>How areas were placed</h2>
      <ul id="method"></ul>
    </div>
    <div>
      <h2>Sources</h2>
      <ul id="sources"></ul>
    </div>
  </section>
</div>

/Affordable-Housing-Land-Trust/DOMINION%20COMMUNITY%20LAND%20TRUST%20AHLT.pdf","award":null},{"org":"East North Avenue CDC","type":"Place-based CDC","website":"","area_in_source":"East North Avenue (name only)","neighborhoods":[],"basis":"not_mapped","note":"Found only on a 2019 city grant list and in registry data; the 2017 East North Avenue LINCS plan that names it could not be retrieved.","source_url":"https://s3.amazonaws.com/baltimorecity.gov.if-us-east-1/s3fs-public/2024-01/2019_ccg_operating_grants_awardees.pdf","award":null},{"org":"East Side CDC","type":"Place-based CDC","website":"","area_in_source":"Baltimore County, MD","neighborhoods":[],"basis":"not_mapped","note":"Appears to be Eastside CDC, 7835 Eastern Ave. Suite 302 (matches its Facebook link); 211 Maryland gives Baltimore County as its service area, so no city NSA.","source_url":"https://search.marylandaccesspoint.211md.org/search/449e808d-2817-56a4-9d88-1f4a6b8bd583","award":null},{"org":"Episcopal Housing Corporation","type":"Citywide","website":"https://www.episcopalhousing.org","area_in_source":"Baltimore City and throughout central Maryland","neighborhoods":[],"basis":"not_mapped","note":"","source_url":"https://www.episcopalhousing.org","award":null},{"org":"Harbor Bank of Maryland Community Development Corporation","type":"Citywide","website":"https://www.theharborbank.com/About-Us/Community-Impact","area_in_source":"Parent bank serves \"the Greater Baltimore and Washington D.C. markets\"; no CDC area stated","neighborhoods":[],"basis":"not_mapped","note":"Website returned HTTP 403 to automated fetch; no specific footprint found in other sources.","source_url":"https://en.wikipedia.org/wiki/The_Harbor_Bank_of_Maryland","award":null},{"org":"Neighborhood Impact Investment Fund (NIIF)","type":"Citywide","website":"https://www.baltimoreniif.org","area_in_source":"Eligible Baltimore City neighborhoods (about 65% of the city, shown on a searchable map only)","neighborhoods":[],"basis":"not_mapped","note":"Eligible Neighborhoods and Impact Investment Neighborhoods are shown only on a map; no names stated.","source_url":"https://www.baltimoreniif.org/eligible-neighborhoods/","award":null},{"org":"SHARE Baltimore","type":"Land trust","website":"https://www.sharebaltimore.org","area_in_source":"Coalition of Baltimore City CLTs (\"Baltimore's CLTs\"); no member areas stated","neighborhoods":[],"basis":"not_mapped","note":"Citywide coalition of land trusts; members page lists members without areas.","source_url":"https://www.sharebaltimore.org/SHARE-Members","award":null},{"org":"St. Ambrose Housing Aid Center","type":"Citywide","website":"https://www.stambros.org","area_in_source":"Throughout Baltimore City and County","neighborhoods":[],"basis":"not_mapped","note":"","source_url":"https://www.stambros.org","award":null},{"org":"The Development Corporation of Northwest Baltimore","type":"Place-based CDC","website":"","area_in_source":"Baltimore City down payment and closing cost assistance programs; Northwest Baltimore in name only","neighborhoods":[],"basis":"not_mapped","note":"Housing counseling agency at 3521 W. Belvedere Ave. (Central Park Heights NSA); no service area found, and its listed website no longer resolves.","source_url":"https://app.ehomeamerica.org/tdc","award":null},{"org":"Healthy Neighborhoods","type":"Healthy Neighborhoods","project":"Liberty Heights cluster","area_in_source":"Hillsdale Heights","neighborhoods":[],"basis":"not_mapped","note":"No city neighborhood boundary and no boundary on the site; part of the Liberty Heights cluster.","source_url":"https://healthyneighborhoods.org/eligible-neighborhoods/","award":null}]};
const CFG = DATA.config;

const W = 800, H = 860;
const RANK = { stated: 2, geocoded: 2, approximate: 1 };
const usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

let filterValue = "all";
let query = "";
let zoomK = 1;
let activeByNb = new Map();
const visible = new Set();

DATA.orgs.forEach((o, i) => {
  o.hue = Math.round((i * 137.508 + 195) % 360);
  o.allNbs = [...new Set(o.rows.flatMap(r => r.neighborhoods))];
  if (CFG.defaultOn === undefined || CFG.defaultOn.includes(o.rows[0][CFG.filter.field])) visible.add(o.id);
});

/* Static text */
document.getElementById("h1").textContent = CFG.title;
document.getElementById("lede").textContent = CFG.lede;
document.getElementById("legend-solid").textContent = CFG.legendSolid;
document.getElementById("legend-dashed").textContent = CFG.legendDashed;
document.getElementById("filter-label").textContent = CFG.filter.label;
const seg = document.getElementById("filter");
seg.setAttribute("aria-label", CFG.filter.label);
CFG.filter.options.forEach(([value, label]) => {
  const b = el("button", null, label); b.type = "button"; b.dataset.value = value;
  b.setAttribute("aria-pressed", String(value === "all"));
  b.addEventListener("click", () => {
    filterValue = value;
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render();
  });
  seg.append(b);
});
CFG.method.forEach(m => { const li = el("li"); li.append(el("b", null, m.lead + ": "), m.text); document.getElementById("method").append(li); });
CFG.sources.forEach(s => {
  const li = el("li");
  if (s.url) { const a = el("a", null, s.label); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; li.append(a); }
  else li.append(s.label);
  if (s.extra) li.append(" " + s.extra);
  document.getElementById("sources").append(li);
});

/* Map */
const fc = { type: "FeatureCollection", features: DATA.neighborhoods.map(n => ({ type: "Feature", properties: { name: n.name }, geometry: n.geometry })) };
const projection = d3.geoMercator().fitExtent([[12, 12], [W - 12, H - 12]], fc);
const geoPath = d3.geoPath(projection);
const pathD = {}, centroid = {};
fc.features.forEach(f => { pathD[f.properties.name] = geoPath(f); centroid[f.properties.name] = geoPath.centroid(f); });

const mapbox = document.getElementById("mapbox");
const svg = d3.select(mapbox).insert("svg", ".legend").attr("class", "map").attr("viewBox", `0 0 ${W} ${H}`)
  .attr("role", "img").attr("aria-label", CFG.ariaLabel);
const g = svg.append("g");
const base = g.append("g").selectAll("path").data(fc.features).join("path")
  .attr("class", "nb").attr("d", d => pathD[d.properties.name]);
const overlay = g.append("g");
const labels = g.append("g").attr("class", "labels");

const zoom = d3.zoom().scaleExtent([1, 10]).translateExtent([[0, 0], [W, H]]).on("zoom", e => {
  g.attr("transform", e.transform);
  zoomK = e.transform.k;
  labels.selectAll("text").attr("font-size", 10.5 / zoomK).style("stroke-width", 3 / zoomK);
});
svg.call(zoom);
document.getElementById("zin").onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1.6);
document.getElementById("zout").onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.6);
document.getElementById("zreset").onclick = () => svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity);

/* Tooltip */
const tip = document.getElementById("tip");
function showTip(event, d) {
  const name = d.properties.name;
  const orgs = activeByNb.get(name) || [];
  tip.replaceChildren(el("strong", null, name));
  if (!orgs.length) tip.append(el("span", null, "No organization shown here."));
  else {
    const ul = el("ul");
    orgs.forEach(o => { const li = el("li"); const sw = el("span", "sw"); sw.style.setProperty("--h", o.hue); li.append(sw, el("span", null, o.name)); ul.append(li); });
    tip.append(ul);
  }
  tip.hidden = false;
  const [x, y] = d3.pointer(event, mapbox);
  const bw = mapbox.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(x + 14, bw - tw - 8)) + "px";
  tip.style.top = Math.max(8, y - th - 12) + "px";
}
base.on("pointermove", showTip).on("click", showTip).on("pointerleave", () => { tip.hidden = true; });

/* Data helpers */
function rowsInFilter(org) { return org.rows.filter(r => filterValue === "all" || r[CFG.filter.field] === filterValue); }
function pairsFor(org) {
  const m = new Map();
  rowsInFilter(org).forEach(r => r.neighborhoods.forEach(n => {
    const rank = RANK[r.basis] || 0;
    if (!m.has(n) || m.get(n) < rank) m.set(n, rank);
  }));
  return [...m].map(([nb, rank]) => ({ nb, approx: rank < 2 }));
}
function matchesQuery(org) {
  if (!query) return true;
  const q = query.toLowerCase();
  return org.name.toLowerCase().includes(q) || org.allNbs.some(n => n.toLowerCase().includes(q))
    || org.rows.some(r => (r.area_in_source || "").toLowerCase().includes(q));
}

/* Render */
function render() {
  const shown = DATA.orgs.filter(o => visible.has(o.id)).map(o => ({ org: o, pairs: pairsFor(o) })).filter(d => d.pairs.length);
  overlay.selectAll("g.org").data(shown, d => d.org.id).join("g")
    .attr("class", "org").style("--h", d => d.org.hue)
    .selectAll("path").data(d => d.pairs, p => p.nb).join("path")
    .attr("d", p => pathD[p.nb]).classed("approx", p => p.approx);

  activeByNb = new Map();
  shown.forEach(d => d.pairs.forEach(p => {
    if (!activeByNb.has(p.nb)) activeByNb.set(p.nb, []);
    activeByNb.get(p.nb).push(d.org);
  }));
  base.classed("on", d => activeByNb.has(d.properties.name));
  labels.selectAll("text").data([...activeByNb.keys()], d => d).join("text")
    .attr("x", d => centroid[d][0]).attr("y", d => centroid[d][1])
    .attr("font-size", 10.5 / zoomK).style("stroke-width", 3 / zoomK).text(d => d);

  const inFilter = DATA.orgs.filter(o => rowsInFilter(o).length);
  const stats = document.getElementById("stats");
  stats.replaceChildren();
  [[shown.length, ` of ${inFilter.length} organizations shown`], [activeByNb.size, " neighborhoods highlighted"],
   [DATA.orgs.length, " " + CFG.statsTotalText]].forEach(([n, t]) => {
    const s = el("span"); s.append(el("b", null, String(n)), t); stats.append(s);
  });
  renderList();
}

function renderList() {
  const list = document.getElementById("list");
  list.replaceChildren();
  const orgs = DATA.orgs.filter(matchesQuery);
  if (!orgs.length) { list.append(el("li", "empty", "No organization or neighborhood matches that search.")); return; }
  orgs.forEach(o => {
    const rows = rowsInFilter(o);
    const li = el("li", "orgrow" + (rows.length ? "" : " off-filter"));
    li.style.setProperty("--h", o.hue);

    const label = el("label");
    const cb = el("input"); cb.type = "checkbox"; cb.id = "chk-" + o.id; cb.checked = visible.has(o.id);
    cb.onchange = () => { cb.checked ? visible.add(o.id) : visible.delete(o.id); render(); };
    label.append(cb, el("span", "sw"), el("span", null, o.name));

    const only = el("button", "only", "Only"); only.type = "button";
    only.setAttribute("aria-label", "Show only " + o.name);
    only.onclick = () => { visible.clear(); visible.add(o.id); render(); };

    const groups = [...new Set(o.rows.map(r => r[CFG.filter.field]))].sort();
    const roles = o.rows.every(r => r.role === "partner") ? " (partner)" : "";
    const nbs = [...new Set(rows.flatMap(r => r.neighborhoods))];
    const nbText = nbs.length > 6 ? nbs.length + " neighborhoods" : nbs.join(", ");
    const meta = el("div", "meta", groups.join(" · ") + roles + " · " + (rows.length ? nbText : "none in this filter"));

    const det = el("details");
    det.append(el("summary", null, o.rows.length === 1 ? "1 " + CFG.entryWord[0] : o.rows.length + " " + CFG.entryWord[1]));
    const ul = el("ul", "proj");
    if (o.url) { const pi = el("li"); const a = el("a", null, o.url.replace(/^https?:\/\//, "").replace(/\/$/, "")); a.href = o.url; a.target = "_blank"; a.rel = "noopener"; pi.append(a); ul.append(pi); }
    o.rows.forEach(r => {
      const pi = el("li");
      const head = [r[CFG.filter.field], r.project || (r.role === "partner" ? "Partner" : "")].filter(Boolean).join(" · ");
      pi.append(el("div", "t", head));
      const d1 = el("div", null, (r.award ? usd.format(r.award) + " · " : "") + CFG.sourceLabel + ": " + (r.area_in_source || "no location") + " → " + r.neighborhoods.join(", ") + " ");
      d1.append(el("span", "badge " + r.basis, CFG.basisText[r.basis] || r.basis));
      pi.append(d1);
      if (r.note) pi.append(el("div", "n", r.note));
      if (r.source_url) { const a = el("a", null, "Source"); a.href = r.source_url; a.target = "_blank"; a.rel = "noopener"; const d2 = el("div"); d2.append(a); pi.append(d2); }
      ul.append(pi);
    });
    det.append(ul);

    li.append(label, only, meta, det);
    li.addEventListener("mouseenter", () => focusOrg(o.id));
    li.addEventListener("mouseleave", () => focusOrg(null));
    list.append(li);
  });
}

function focusOrg(id) {
  svg.classed("focusing", !!id && visible.has(id));
  overlay.selectAll("g.org").classed("focus", d => d.org.id === id);
  if (id) overlay.selectAll("g.org").filter(d => d.org.id === id).raise();
}

document.getElementById("allon").onclick = () => { DATA.orgs.filter(matchesQuery).forEach(o => visible.add(o.id)); render(); };
document.getElementById("alloff").onclick = () => { DATA.orgs.filter(matchesQuery).forEach(o => visible.delete(o.id)); render(); };
document.getElementById("search").addEventListener("input", e => { query = e.target.value.trim(); renderList(); });

/* Unmapped table */
if (!DATA.unmapped.length) document.getElementById("unmapped-section").hidden = true;
else {
  document.getElementById("unmapped-title").textContent = CFG.unmapped.title;
  document.getElementById("unmapped-lede").textContent = CFG.unmapped.lede;
  CFG.unmapped.columns.forEach(c => document.getElementById("unmapped-head").append(el("th", null, c[0])));
  const tb = document.getElementById("unmapped");
  DATA.unmapped.forEach(r => {
    const tr = el("tr");
    CFG.unmapped.columns.forEach(([, field, kind]) => {
      let v = r[field] || "";
      if (kind === "money") v = r[field] ? usd.format(r[field]) : "";
      if (kind === "link" && v) { const td = el("td"); const a = el("a", null, v.replace(/^https?:\/\//, "").replace(/\/$/, "")); a.href = v; a.target = "_blank"; a.rel = "noopener"; td.append(a); tr.append(td); return; }
      tr.append(el("td", kind === "money" ? "num" : null, v));
    });
    tb.append(tr);
  });
}

render();
</script>

</body>
</html>
